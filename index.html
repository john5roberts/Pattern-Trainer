<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f17">
<title>Pattern-Trainer</title>
<meta name="apple-mobile-web-app-title" content="Pattern-Trainer">
<style>
:root {
  color-scheme:dark;
  --board-w:183px; --board-h:586px; --head-h:56px; --nut-h:14px;
  --green:#21f07d; --ink:#f2f6fb; --muted:#aeb9c8; --border:rgba(215,230,255,.18);
}
* {box-sizing:border-box}
[hidden] {display:none!important}
html,body {margin:0;min-height:100%;background:radial-gradient(circle at 50% 0%,#182235 0%,#0b0f17 45%,#05070b 100%);color:var(--ink);font:14px Arial,Helvetica,sans-serif}
body {padding:max(9px,env(safe-area-inset-top)) 8px max(18px,env(safe-area-inset-bottom));}
button, select {font:inherit;touch-action:manipulation;cursor:pointer;-webkit-tap-highlight-color:transparent}
.app {
  width:max-content;max-width:100%;margin:0 auto;padding:10px 10px 10px;
  background:linear-gradient(180deg,rgba(24,32,46,.94),rgba(10,14,22,.96));
  border:1px solid rgba(180,205,240,.16);border-radius:28px;
  box-shadow:0 20px 52px #0008;
}
.app-title {margin:0 0 8px;text-align:center;font-size:15px;line-height:17px;font-weight:700;letter-spacing:.3px;color:#dbe7f7;}
.layout {display:flex;align-items:flex-start;justify-content:center;gap:12px;}
.leftcol {width:92px;display:flex;flex-direction:column;gap:7px;align-items:stretch;flex-shrink:0;}
.keypanel,.practice-tab {
  width:92px;background:linear-gradient(180deg,rgba(29,39,56,.92),rgba(16,23,35,.92));
  border:1px solid var(--border);border-radius:16px;color:var(--ink);
  box-shadow:0 7px 18px #0005,inset 0 1px #ffffff12;
}
.keypanel {height:76px;display:flex;justify-content:center;align-items:center;padding:8px}
#keySel {
  width:100%;max-width:100%;height:34px;padding:0 15px 0 4px;
  border:1px solid #ffffff77;border-radius:10px;background:#05070b;color:#f7fbff;
  font-size:13px;font-weight:650;text-align:center;text-align-last:center;
  appearance:none;-webkit-appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,white 50%),linear-gradient(135deg,white 50%,transparent 50%);
  background-position:calc(100% - 11px) 15px,calc(100% - 7px) 15px;
  background-size:4px 4px,4px 4px;background-repeat:no-repeat;
}
#keySel option {background:#101722;color:#fff}
/* Mode tabs use only enough height for their text. */
.practice-tab {min-height:34px;height:auto;flex:0 0 auto;display:flex;justify-content:center;align-items:center;padding:8px 4px;line-height:1.17;font-weight:700;font-size:13px;text-align:center;}
/* Compact two-way notation toggle, above the exercise buttons. */
.notation-toggle {width:92px;display:grid;grid-template-columns:1fr 1fr;gap:2px;padding:3px;border:1px solid var(--border);background:#0b1421;border-radius:12px;}
.notation-option {min-width:0;padding:8px 1px;border:0;border-radius:8px;background:transparent;color:#bccbdc;font-size:10px;font-weight:700;line-height:1.1;letter-spacing:-.2px;}
.notation-option[aria-pressed="true"] {background:#304661;color:#fff;box-shadow:inset 0 0 0 1px #70b2ff77;}

.practice-tab[aria-pressed="true"] {background:linear-gradient(180deg,#304661,#1c304b);border-color:#70b2ff;box-shadow:inset 0 0 0 1px #70b2ff66,0 0 13px #4aa3ff33,0 10px 24px #0006;}
button:focus-visible,select:focus-visible {outline:2px solid #9acbff;outline-offset:3px}
.wrap {padding:8px;background:linear-gradient(180deg,rgba(18,26,38,.7),rgba(8,12,19,.72));border:1px solid #d2e2ff22;border-radius:18px;box-shadow:0 14px 35px #0007}
.shell {
  width:var(--board-w);position:relative;padding-top:var(--head-h);isolation:isolate;
  background:linear-gradient(180deg,#161f2e,#101722 20%,#0b1018);border-radius:0 0 8px 8px;
  box-shadow:inset 0 0 0 1px #d2e2ff1a,inset 10px 0 22px #0003,inset -10px 0 22px #0003;
}
.openrow {position:absolute;left:0;top:0;height:var(--head-h);width:100%;pointer-events:none}
.open {position:absolute;top:32px;transform:translateX(-50%);width:23px;height:23px;display:flex;align-items:center;justify-content:center;color:#dbe7f7;font-size:13px;font-weight:700;}
.nut {position:absolute;top:calc(var(--head-h) - 4px);left:0;width:100%;height:var(--nut-h);background:#e8eef7;box-shadow:0 0 10px #ffffff38;z-index:5}
.board {
  position:relative;height:var(--board-h);width:100%;overflow:visible;
  background:linear-gradient(90deg,#ffffff08 0 1px,transparent 1px 100%),linear-gradient(180deg,#ffffff0a,#0003);
}
.fret {position:absolute;left:0;width:100%;height:2px;background:#e6f0ff6b;box-shadow:0 0 6px #8cb4ff2e;z-index:2}
.string {position:absolute;top:0;height:100%;transform:translateX(-50%);border-radius:100px;background:#e8f1ff9e;box-shadow:0 0 6px #b4d2ff42;z-index:3;}
.inlay {position:absolute;width:14px;height:14px;border-radius:50%;background:#e8f1ff38;box-shadow:0 0 12px #b4d2ff1f;transform:translate(-50%,-50%);z-index:1;left:50%;}
.fretlab {position:absolute;right:-18px;transform:translateY(-50%);width:18px;text-align:center;color:#aeb9c8;font-size:13px;font-weight:600;z-index:16}
.stringlab {position:absolute;bottom:-21px;transform:translateX(-50%);width:18px;text-align:center;color:#aeb9c8;font-size:13px;font-weight:600;z-index:16}
.gdot {
  position:absolute;width:25px;height:25px;border-radius:50%;transform:translate(-50%,-50%);
  background:#15bd62;border:1px solid #9cffba;
  box-shadow:0 0 0 1px #ffffff18,0 2px 5px #0008;
  color:#031b0c;display:flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:800;pointer-events:none;z-index:20;
}
.gdot.open-dot {transform:translate(-50%,-50%)}
.gdot.anchor,.gdot.reveal {background:#21f07d;color:#04180c;border-color:#baffd0;z-index:24}
.gdot.flash {animation:blink 850ms ease-in-out infinite;z-index:23}
.gdot.preview {background:#eaffec;border-color:#ffffff;box-shadow:0 0 0 4px #a4ffc268,0 0 17px 6px #21f07d99;z-index:25}
@keyframes blink {
  0%,24%,69%,100% {background:#e8ffec;border-color:white;box-shadow:0 0 0 4px #c5ffd266,0 0 16px 5px #9affaa90}
  38%,58% {background:#15bd62;border-color:#9cffba;box-shadow:0 0 0 1px #ffffff18,0 2px 5px #0008}
}
.answers {display:grid;grid-template-columns:1fr;gap:5px;width:92px;margin:0;}
.answer {min-width:0;height:46px;color:var(--ink);background:linear-gradient(180deg,#263950,#15263c);border:1px solid #677e9a;border-radius:12px;font-size:27px;font-weight:800}
.answer:disabled {opacity:.7;cursor:default}
.answer.correct {background:#195e3a;border-color:#8be2ac;color:white;opacity:1}
.answer.wrong {background:#602b35;border-color:#ff9d9a}
/* The Guit-Map source defines a 183 × 586 px 15-fret board.
   Keep the precise source dimensions on every phone size; never scale the frets. */
@media (max-width:350px) {
  .app {padding:9px 6px 9px}
  .layout {gap:7px}
  .leftcol,.keypanel,.practice-tab,.answers,.notation-toggle {width:85px}
  .wrap {padding:6px}
  .practice-tab {font-size:12px}
  .notation-option {font-size:9px}
  .answer {height:46px}
}
@media (prefers-reduced-motion:reduce) {.gdot.flash {animation:none;background:#e8ffec;border-color:white;box-shadow:0 0 0 4px #c5ffd266}}
</style>
</head>
<body>
<main class="app" aria-label="Pattern-Trainer">
  <h1 class="app-title">Pattern-Trainer</h1>
  <div class="layout">
    <nav class="leftcol" aria-label="Key and exercises">
      <div class="keypanel"><select id="keySel" aria-label="Major key"></select></div>
      <div class="notation-toggle" role="group" aria-label="Label notation">
        <button type="button" class="notation-option" data-notation="intervals" aria-pressed="true">Intervals</button>
        <button type="button" class="notation-option" data-notation="notes" aria-pressed="false">Notes</button>
      </div>
      <button class="practice-tab" data-practice="adjacent" aria-pressed="true">Adjacent</button>
      <button class="practice-tab" data-practice="step" aria-pressed="false">Step Stack</button>
      <button class="practice-tab" data-practice="jump" aria-pressed="false">Jump Stack</button>
      <button class="practice-tab" id="xstartButton" data-practice="xstart" aria-pressed="false">X-start</button>
      <div class="answers" id="answers" aria-label="Select the interval"></div>
    </nav>
    <div class="wrap">
      <div class="shell">
        <div class="openrow" id="openrow"></div>
        <div class="nut"></div>
        <div class="board" id="board"></div>
      </div>
    </div>
  </div>
</main>
<script>
(() => {
  'use strict';
  // Geometry, key naming and box offsets reproduce the uploaded Guit-Map.
  const BOARD_FRETS=15, INLAY_FRETS=[3,5,7,9,12,15], STRING_WIDTH=[6,5,4,3,2.5,2];
  const OPEN_MIDI=[40,45,50,55,59,64]; // E2 A2 D3 G3 B3 e4
  const KEYS=[['C','Am'],['C#','A#m'],['D','Bm'],['D#','Cm'],['E','C#m'],['F','Dm'],['F#','D#m'],['G','Em'],['G#','Fm'],['A','F#m'],['A#','Gm'],['B','G#m']];
  const SH=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  const DEGREES=[1,2,3,5,6];
  const OFF={1:0,2:2,3:4,5:7,6:9};
  const PC_TO_DEG={0:1,2:2,4:3,7:5,9:6};
  const CYCLE=[6,2,5,1,3];
  const STEP=[[2,3],[5,6],[1,2]];
  const JUMP=[[3,5],[6,1]];
  const BOX_OFFSETS={
    1:[[0,3],[0,2],[0,2],[0,2],[0,3],[0,3]],
    2:[[3,5],[2,5],[2,5],[2,4],[3,5],[3,5]],
    3:[[5,7],[5,7],[5,7],[4,7],[5,8],[5,7]],
    4:[[7,10],[7,10],[7,9],[7,9],[8,10],[7,10]],
    5:[[10,12],[10,12],[9,12],[9,12],[10,12],[10,12]]
  };
  const BOX_DEGREE={1:6,2:1,3:2,4:3,5:5};
  const ANSWERS=[1,2,3,5,6];
  const $=id=>document.getElementById(id);
  const mod=(v,n=12)=>((v%n)+n)%n;
  const rand=n=>Math.floor(Math.random()*n);
  const board=$('board'), openrow=$('openrow'), selector=$('keySel'), answerPanel=$('answers');
  let keyPc=0, practice='adjacent', notation='intervals', config=null, pattern=[], dots=[], flashIndex=-1, anchorIndex=-1;
  let introTimers=[], revealTimers=new Map(), holdTimer=null, locked=true, generation=0;
  let audioCtx=null, lastBox=null;

  function midiFor(n){return OPEN_MIDI[n.s]+n.f;}
  function degreeAt(s,f){return PC_TO_DEG[mod(OPEN_MIDI[s]+f-keyPc)]||null;}
  function labelForDegree(degree){
    return notation==='notes' ? SH[mod(keyPc+OFF[degree])] : String(degree);
  }
  function updateXStartButton(){
    const btn=$('xstartButton');
    if(practice!=='xstart'||!config||!config.box){btn.textContent='X-start';return;}
    const degree=BOX_DEGREE[config.box];
    btn.textContent=labelForDegree(degree)+'-start';
  }
  function updateNotationLabels(){
    dots.forEach((dot,i)=>{
      if(dot.classList.contains('anchor')||dot.classList.contains('reveal')){
        dot.textContent=labelForDegree(pattern[i].degree);
      }
    });
    answerPanel.querySelectorAll('.answer').forEach(btn=>{
      const d=Number(btn.dataset.degree);
      btn.textContent=labelForDegree(d);
      btn.setAttribute('aria-label', (notation==='notes' ? 'Note ' : 'Interval ')+labelForDegree(d));
    });
    updateXStartButton();
  }
  function ensureAudio(){
    try{
      const AC=window.AudioContext||window.webkitAudioContext;
      if(!AC)return null;
      if(!audioCtx)audioCtx=new AC();
      if(audioCtx.state==='suspended')return audioCtx.resume().catch(()=>{});
      return null;
    }catch(e){return null;}
  }
  function pluck(midi){
    try{
      if(!audioCtx||audioCtx.state!=='running')return;
      const now=audioCtx.currentTime, hz=440*Math.pow(2,(midi-69)/12);
      const env=audioCtx.createGain();
      env.gain.setValueAtTime(.0001,now);
      env.gain.exponentialRampToValueAtTime(.18,now+.008);
      env.gain.exponentialRampToValueAtTime(.0001,now+.44);
      env.connect(audioCtx.destination);
      [ [1,'triangle',.78], [2,'sine',.18], [3,'sine',.07] ].forEach(([part,type,amp])=>{
        const osc=audioCtx.createOscillator();
        const gain=audioCtx.createGain();
        osc.type=type;osc.frequency.value=hz*part;
        gain.gain.value=amp;
        osc.connect(gain).connect(env);
        osc.start(now);osc.stop(now+.47);
      });
    }catch(e){}
  }
  function soundAnsweredNote(note){
    // Answer taps count as gestures, so they can unlock audio even if the
    // initial automatic preview was silent under a mobile browser's policy.
    const ready=ensureAudio();
    const token=generation;
    if(ready && typeof ready.then==='function'){
      ready.then(()=>{if(token===generation)pluck(midiFor(note));}).catch(()=>{});
    }else{
      pluck(midiFor(note));
    }
  }
  function clearPending(){
    generation++;
    introTimers.forEach(clearTimeout);introTimers=[];
    if(holdTimer!==null)clearTimeout(holdTimer);
    holdTimer=null;
    for(const t of revealTimers.values())clearTimeout(t);
    revealTimers.clear();
  }
  function stringXs(){const w=board.clientWidth,m=14;return Array.from({length:6},(_,i)=>m+(w-2*m)*i/5)}
  function fretY(f){return f/BOARD_FRETS*board.clientHeight}
  function yForFret(f){return (fretY(f-1)+fretY(f))/2}
  function addElement(parent,className,styles,text){
    const el=document.createElement('div');el.className=className;
    if(styles)Object.assign(el.style,styles);
    if(text!==undefined)el.textContent=String(text);
    parent.appendChild(el);return el;
  }
  function drawBoard(){
    board.replaceChildren();openrow.replaceChildren();
    const xs=stringXs();
    xs.forEach((x,s)=>addElement(openrow,'open',{left:x+'px'},SH[mod(OPEN_MIDI[s])]));
    for(let f=1;f<=BOARD_FRETS;f++){
      addElement(board,'fret',{top:(fretY(f)-1)+'px'});
      addElement(board,'fretlab',{top:yForFret(f)+'px'},f);
    }
    xs.forEach((x,s)=>{
      addElement(board,'string',{left:x+'px',width:STRING_WIDTH[s]+'px'});
      addElement(board,'stringlab',{left:x+'px'},6-s);
    });
    INLAY_FRETS.forEach(f=>{
      const y=yForFret(f);
      if(f===12){[.3,.7].forEach(frac=>addElement(board,'inlay',{top:y+'px',left:(frac*board.clientWidth)+'px'}));}
      else addElement(board,'inlay',{top:y+'px'});
    });
  }
  function makeDot(n){
    const x=stringXs()[n.s];
    const parent=n.f===0?openrow:board;
    const dot=addElement(parent,'gdot'+(n.f===0?' open-dot':''),{
      left:x+'px',top:(n.f===0?43:yForFret(n.f))+'px'
    });
    return dot;
  }
  function updateDots(){
    drawBoard();dots=pattern.map(makeDot);
  }
  function buildAdjacent(conf){
    const start=conf.degreeIndex;
    const degrees=Array.from({length:6},(_,i)=>CYCLE[(start+i)%5]);
    const candidates=[];
    for(let firstF=0;firstF<=BOARD_FRETS;firstF++){
      if(degreeAt(0,firstF)!==degrees[0])continue;
      let f=firstF,valid=true;
      const pos=[{s:0,f,degree:degrees[0]}];
      for(let s=1;s<6;s++){
        const dist=mod(OFF[degrees[s]]-OFF[degrees[s-1]]);
        f+=dist-(OPEN_MIDI[s]-OPEN_MIDI[s-1]);
        if(f<0||f>BOARD_FRETS||degreeAt(s,f)!==degrees[s]){valid=false;break;}
        pos.push({s,f,degree:degrees[s]});
      }
      if(valid)candidates.push(pos);
    }
    candidates.sort((a,b)=>{
      const score=p=>Math.abs(p.reduce((sum,n)=>sum+n.f,0)/p.length-7.5);
      return score(a)-score(b);
    });
    if(!candidates.length)throw Error('Adjacent position unavailable');
    return candidates[0];
  }
  function buildPairPattern(groups,startString){
    const candidates=[];
    const firstDegree=groups[0][0];
    for(let f=0;f<=BOARD_FRETS;f++){
      if(degreeAt(startString,f)!==firstDegree)continue;
      const pattern=[];let valid=true;
      for(let col=0;col<groups.length;col++){
        const s=startString+col;
        const lower=groups[col][0],upper=groups[col][1];
        // 4th-tuned strings preserve the fret; G→B requires +1 fret.
        const shift=(startString<=3 && s>=4)?1:0;
        const lo=f+shift,hi=lo+mod(OFF[upper]-OFF[lower]);
        if(lo<0||hi>BOARD_FRETS||degreeAt(s,lo)!==lower||degreeAt(s,hi)!==upper){valid=false;break;}
        pattern.push({s,f:lo,degree:lower},{s,f:hi,degree:upper});
      }
      if(valid)candidates.push(pattern);
    }
    candidates.sort((a,b)=>{
      const score=p=>Math.abs(p.reduce((sum,n)=>sum+n.f,0)/p.length-7.5);
      return score(a)-score(b);
    });
    if(!candidates.length)throw Error('Stack position unavailable');
    return candidates[0];
  }
  function buildBox(box){
    // Exact 5 box offsets from the supplied Guit-Map, relative to the 6th degree on E2.
    const relativeMinorPc=mod(keyPc+9);
    const base=mod(relativeMinorPc-OPEN_MIDI[0]);
    const offsets=BOX_OFFSETS[box], candidates=[];
    for(let shift=-24;shift<=12;shift+=12){
      const anchor=base+shift;
      const p=[];let valid=true;
      for(let s=0;s<6;s++)for(const off of offsets[s]){
        const f=anchor+off,degree=degreeAt(s,f);
        if(f<0||f>BOARD_FRETS||degree===null){valid=false;break;}
        p.push({s,f,degree});
      }
      if(valid)candidates.push(p);
    }
    candidates.sort((a,b)=>{
      const score=p=>Math.abs(p.reduce((sum,n)=>sum+n.f,0)/p.length-7.5);
      return score(a)-score(b);
    });
    if(!candidates.length)throw Error('Box position unavailable');
    if(candidates[0][0].degree!==BOX_DEGREE[box])throw Error('Box start-degree mismatch');
    return candidates[0];
  }
  function nextConfig(next){
    if(next==='adjacent')return {degreeIndex:rand(5)};
    if(next==='step')return {start:rand(4)};
    if(next==='jump')return {start:rand(5)};
    const available=[1,2,3,4,5].filter(n=>n!==lastBox);
    const box=available[rand(available.length)];lastBox=box;
    return {box};
  }
  function buildPattern(){
    switch(practice){
      case 'adjacent':return buildAdjacent(config);
      case 'step':return buildPairPattern(STEP,config.start);
      case 'jump':return buildPairPattern(JUMP,config.start);
      case 'xstart':return buildBox(config.box);
    }
  }
  function setLocked(value){
    locked=value;answerPanel.querySelectorAll('.answer').forEach(b=>b.disabled=value);
  }
  function setFlash(i){
    flashIndex=i;
    dots.forEach((dot,k)=>dot.classList.toggle('flash',k===i));
  }
  function clearReveal(){
    dots.forEach(dot=>{dot.classList.remove('reveal');if(!dot.classList.contains('anchor'))dot.textContent='';});
  }
  function placeAdjacent(excluded=[]){
    const ex=new Set(excluded);
    const viable=pattern.map((_,i)=>i).filter(i=>!ex.has(i)&&[i-1,i+1].some(j=>j>=0&&j<pattern.length&&!ex.has(j)));
    if(!viable.length)return false;
    anchorIndex=viable[rand(viable.length)];
    const neighbors=[anchorIndex-1,anchorIndex+1].filter(i=>i>=0&&i<pattern.length&&!ex.has(i));
    const next=neighbors[rand(neighbors.length)];
    dots.forEach((dot,i)=>{
      dot.classList.toggle('anchor',i===anchorIndex);
      if(!ex.has(i))dot.textContent=i===anchorIndex?labelForDegree(pattern[i].degree):'';
    });
    setFlash(next);return true;
  }
  function startQuiz(){
    clearReveal();
    if(practice==='adjacent')placeAdjacent();
    else setFlash(rand(pattern.length));
    setLocked(false);
  }
  function playPreview(){
    setLocked(true);setFlash(-1);
    dots.forEach(d=>{d.textContent='';d.classList.remove('anchor','reveal','preview');});
    const ordered=pattern.map((n,i)=>({n,i})).sort((a,b)=>midiFor(a.n)-midiFor(b.n)||a.n.s-b.n.s);
    let played=0,token=generation;
    const playAt=(i)=>{
      if(token!==generation)return;
      if(i>0)dots[ordered[i-1].i].classList.remove('preview');
      const entry=ordered[i];
      dots[entry.i].classList.add('preview');
      pluck(midiFor(entry.n));played++;
    };
    if(!ordered.length){startQuiz();return;}
    playAt(0);
    for(let i=1;i<ordered.length;i++)introTimers.push(setTimeout(()=>playAt(i),500*i));
    introTimers.push(setTimeout(()=>{
      if(token!==generation)return;
      dots.forEach(dot=>dot.classList.remove('preview'));
      startQuiz();
    },500*ordered.length));
  }
  function refresh(newConfig){
    clearPending();setLocked(true);
    const audioReady=ensureAudio();
    if(newConfig)config=nextConfig(practice);
    pattern=buildPattern();
    updateXStartButton();
    updateDots();
    // A browser may need the user's first tap to activate Web Audio.
    // When resuming, start the playback only after the context is ready,
    // with a short visual-only fallback if autoplay is not permitted.
    if(audioReady && audioCtx?.state==='suspended'){
      const token=generation;
      let started=false;
      const begin=()=>{
        if(token!==generation||started)return;
        started=true;
        playPreview();
      };
      const fallback=setTimeout(begin,180);
      introTimers.push(fallback);
      audioReady.then(()=>{clearTimeout(fallback);begin();},()=>{clearTimeout(fallback);begin();});
    }else playPreview();
  }
  function answer(v,button){
    if(locked||flashIndex<0)return;
    if(v!==pattern[flashIndex].degree){button.classList.add('wrong');return;}
    button.classList.add('correct');
    const correctIndex=flashIndex,answered=dots[correctIndex];
    soundAnsweredNote(pattern[correctIndex]);
    if(practice==='adjacent'){
      // Only ONE interval is ever written: the newly selected anchor.
      // The answered note sounds, but its number is not displayed.
      dots.forEach(dot=>{
        dot.textContent='';
        dot.classList.remove('anchor','reveal','flash');
      });
      setFlash(-1);
      placeAdjacent();
      answerPanel.querySelectorAll('.answer').forEach(b=>b.classList.remove('wrong','correct'));
      // Do not lock, delay or briefly reveal a second interval.
    }else{
      answered.textContent=labelForDegree(v);
      answered.classList.add('reveal');
      answered.classList.remove('flash');
      setLocked(true);
      const remaining=pattern.map((_,i)=>i).filter(i=>i!==correctIndex);
      setFlash(remaining[rand(remaining.length)]);
      const token=generation;
      holdTimer=setTimeout(()=>{
        if(token!==generation)return;
        holdTimer=null;
        clearReveal();
        answerPanel.querySelectorAll('.answer').forEach(b=>b.classList.remove('wrong','correct'));
        setLocked(false);
      },1000);
    }
  }
  function populateKeys(){
    KEYS.forEach(([major,minor],pc)=>{
      const option=new Option(major+'/'+minor,String(pc));selector.add(option);
    });
    // Start randomly, intentionally not fixing C as the startup selection.
    keyPc=1+rand(11);
    selector.value=String(keyPc);
  }
  function setupAnswers(){
    ANSWERS.forEach(value=>{
      const button=document.createElement('button');
      button.type='button';button.className='answer';button.dataset.degree=String(value);
      button.textContent=labelForDegree(value);
      button.setAttribute('aria-label',(notation==='notes'?'Note ':'Interval ')+labelForDegree(value));
      button.addEventListener('click',()=>answer(value,button));
      answerPanel.appendChild(button);
    });
  }
  document.querySelectorAll('[data-notation]').forEach(button=>{
    button.addEventListener('click',()=>{
      notation=button.dataset.notation;
      document.querySelectorAll('[data-notation]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));
      updateNotationLabels();
    });
  });
  document.querySelectorAll('[data-practice]').forEach(button=>{
    button.addEventListener('click',()=>{
      practice=button.dataset.practice;
      document.querySelectorAll('[data-practice]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));
      refresh(true);
    });
  });
  selector.addEventListener('change',()=>{
    keyPc=Number(selector.value);
    refresh(false); // Keep the selected string group or box while transposing.
  });
  setupAnswers();populateKeys();
  config=nextConfig(practice);
  refresh(false);
})();
</script>
</body>
</html>
